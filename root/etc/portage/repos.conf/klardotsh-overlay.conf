[klardotsh]
location = /var/db/repos/klardotsh-overlay
sync-type = git
sync-uri = file:///home/j/src/mine/klardotsh-overlay
sync-git-verify-commit-signature = yes
sync-openpgp-key-package = sec-keys/openpgp-keys-klardotsh
sync-openpgp-key-path = /usr/share/openpgp-keys/klardotsh.asc
sync-openpgp-key-refresh = true
sync-openpgp-keyserver = hkps://keyserver.ubuntu.com
masters = gentoo
