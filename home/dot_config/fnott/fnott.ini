# fnott configuration, styled to match the previous mako setup.
# Unlike mako, fnott has no default height cap, so the full usage table fits.

anchor=top-right
layer=overlay
stacking-order=bottom-up

min-width=350
max-width=400
max-height=0

edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=10

padding-vertical=14
padding-horizontal=14

border-size=2
border-radius=5

background=282a36ff
border-color=44475aff

# Hide the app name; mako showed only the summary and body.
title-format=
summary-format=<b>%s</b>
body-format=%b

title-font=sans-serif:size=14
summary-font=sans-serif:size=14
body-font=sans-serif:size=14

title-color=ffffffff
summary-color=ffffffff
body-color=ffffffff

# Match mako: 10 second default. The slopstat script sets 30 seconds itself.
default-timeout=10
max-timeout=0

[critical]
border-color=ff5555ff
